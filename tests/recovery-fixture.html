<!doctype html><html lang="en"><meta charset="utf-8"><title>DraftBack recovery test</title><style>label{display:block;margin:10px}input,textarea,select{font:16px system-ui}body{padding:24px}iframe{height:100px}</style>
<form id="application"><label>First name<input name="firstName"></label><label>Email<input type="email" name="email"></label><label>Phone<input type="tel" name="phone"></label><label>Website<input type="url" name="website"></label><label>Dependents<input type="number" name="dependents"></label><label>Birth date<input type="date" name="birthDate"></label><label>Start month<input type="month" name="month"></label><label>Week<input type="week" name="week"></label><label>Time<input type="time" name="time"></label><label>Appointment<input type="datetime-local" name="appointment"></label>
<label>Country<select name="country"><option value="">Choose</option><option value="IN">India</option><option value="GB">United Kingdom</option></select></label><label>Languages<select multiple name="languages"><option value="en">English</option><option value="hi">Hindi</option><option value="fr">French</option></select></label>
<fieldset><legend>Application service</legend><label><input name="service" type="radio" value="new">New</label><label><input name="service" type="radio" value="renew">Renewal</label></fieldset><label><input type="checkbox" name="previousApplication">I have applied before</label>
<label>Short reason<textarea name="shortReason"></textarea></label><label>Long supporting answer<textarea name="longReason"></textarea></label><div contenteditable="true" role="textbox" aria-label="Personal statement" style="border:1px solid;padding:10px"></div>
<label>Password<input type="password" name="password"></label><label>Passport number<input name="passportNumber"></label><label>Card number<input name="creditCard"></label><label>One time code<input name="otp"></label><label><input type="checkbox" name="consent">I agree to the terms</label><label>Upload<input type="file" name="resume"></label><input type="hidden" name="hidden"><label>Disabled<input name="disabled" disabled></label><label>Read-only<input name="readonly" readonly></label><details><summary>Closed section</summary><input name="collapsed"></details>
<div id="conditional"></div><button type="reset">Reset form</button><button type="submit">Submit (test blocked)</button></form><div id="shadow-host"></div><iframe id="embedded" srcdoc="<label>City<input name='city'></label>"></iframe>
<script>
window.submits=0;document.addEventListener('submit',e=>{e.preventDefault();submits++});
const scenario=new URL(location.href).searchParams.get('case');
if(scenario==='shadow')document.getElementById('shadow-host').attachShadow({mode:'open'}).innerHTML='<label>Employer<input name="employer"></label>';
if(scenario==='conditional')document.querySelector('[name=country]').addEventListener('change',()=>{setTimeout(()=>{document.getElementById('conditional').innerHTML=document.querySelector('[name=country]').value==='IN'?'<label>State<select name="state"><option value="">Choose</option><option value="MH">Maharashtra</option></select></label>':''},100)});
if(scenario==='ambiguous')document.getElementById('conditional').innerHTML='<input name="duplicate"><input name="duplicate"><input>';
if(scenario==='custom')document.getElementById('conditional').innerHTML='<label>Search country<input name="customCountry" role="combobox"></label>';
if(scenario==='placeholder')document.getElementById('conditional').innerHTML='<div><span>Embassy/Consulate *</span><select><option value="">Select</option><option value="289">Australia - Brisbane</option></select></div><input placeholder="Given Name *"><div><span>Hint question *</span><select><option value="">Select</option><option value="secret">Secret</option></select></div>';
if(scenario==='late')setTimeout(()=>{document.getElementById('conditional').innerHTML='<label>Late answer<input name="lateAnswer"></label>';},1200);
if(scenario==='multiple-forms')document.body.insertAdjacentHTML('beforeend','<form id="other-person"><label>First name<input name="firstName"></label></form>');
if(scenario==='controlled')document.querySelector('[name=firstName]').addEventListener('input',e=>{window.controlledValue=e.target.value});
if(scenario==='rerender')document.querySelector('[name=firstName]').addEventListener('input',e=>{setTimeout(()=>{const replacement=e.target.cloneNode();replacement.value=e.target.value;e.target.replaceWith(replacement)},30)});
if(scenario==='rejected')document.querySelector('[name=firstName]').addEventListener('input',e=>{if(sessionStorage.getItem('reject'))setTimeout(()=>{e.target.value=''},50)});
</script></html>
